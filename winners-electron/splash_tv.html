<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Winners TV</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      width: 480px;
      height: 360px;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      background: transparent;
      font-family: 'Segoe UI', 'Inter', system-ui, -apple-system, sans-serif;
      -webkit-app-region: drag;
      user-select: none;
    }

    .splash-container {
      width: 440px;
      height: 320px;
      border-radius: 20px;
      background: linear-gradient(145deg, #090D16 0%, #150A21 40%, #290826 100%);
      box-shadow:
        0 25px 60px rgba(0, 0, 0, 0.8),
        0 0 80px rgba(230, 9, 125, 0.2),
        inset 0 1px 0 rgba(255, 255, 255, 0.08);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
    }

    .splash-container::before {
      content: '';
      position: absolute;
      width: 220px;
      height: 220px;
      background: radial-gradient(circle, rgba(230, 9, 125, 0.35) 0%, transparent 70%);
      top: 20px;
      animation: pulseGlow 3s ease-in-out infinite;
    }

    @keyframes pulseGlow {
      0%, 100% { transform: scale(1); opacity: 0.5; }
      50% { transform: scale(1.25); opacity: 0.95; }
    }

    .splash-container::after {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: 20px;
      padding: 1.5px;
      background: linear-gradient(135deg,
        rgba(230, 9, 125, 0.8) 0%,
        rgba(147, 51, 234, 0.5) 50%,
        rgba(26, 71, 137, 0.8) 100%
      );
      -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
      -webkit-mask-composite: xor;
      mask-composite: exclude;
      animation: borderRotate 5s linear infinite;
    }

    @keyframes borderRotate {
      0% { filter: hue-rotate(0deg); }
      100% { filter: hue-rotate(360deg); }
    }

    .logo-wrapper {
      position: relative;
      z-index: 2;
      margin-bottom: 18px;
    }

    .logo-icon {
      width: 84px;
      height: 84px;
      border-radius: 22px;
      background: linear-gradient(135deg, #E6097D 0%, #7E22CE 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 10px 35px rgba(230, 9, 125, 0.45);
    }

    .logo-icon svg {
      width: 48px;
      height: 48px;
      fill: #fff;
      filter: drop-shadow(0 2px 6px rgba(0,0,0,0.4));
    }

    .app-title {
      position: relative;
      z-index: 2;
      font-size: 28px;
      font-weight: 800;
      letter-spacing: 3px;
      text-transform: uppercase;
      background: linear-gradient(135deg, #FFFFFF 0%, #F472B6 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 4px;
    }

    .app-subtitle {
      position: relative;
      z-index: 2;
      font-size: 11px;
      color: #A855F7;
      letter-spacing: 4px;
      text-transform: uppercase;
      font-weight: 600;
      margin-bottom: 32px;
    }

    .loading-container {
      position: relative;
      z-index: 2;
      width: 260px;
      height: 4px;
      background: rgba(255, 255, 255, 0.08);
      border-radius: 4px;
      overflow: hidden;
      margin-bottom: 14px;
    }

    .loading-bar {
      height: 100%;
      width: 45%;
      border-radius: 4px;
      background: linear-gradient(90deg, #E6097D, #A855F7, #3B82F6, #E6097D);
      background-size: 250% 100%;
      animation: loadSlide 1.6s ease-in-out infinite, loadGradient 2.5s linear infinite;
    }

    @keyframes loadSlide {
      0% { transform: translateX(-100%); }
      100% { transform: translateX(350%); }
    }

    @keyframes loadGradient {
      0% { background-position: 0% 0%; }
      100% { background-position: 250% 0%; }
    }

    .loading-text {
      position: relative;
      z-index: 2;
      font-size: 11px;
      color: #94A3B8;
      letter-spacing: 0.5px;
    }

    .loading-text span {
      animation: dotPulse 1.4s infinite;
    }
    .loading-text span:nth-child(2) { animation-delay: 0.2s; }
    .loading-text span:nth-child(3) { animation-delay: 0.4s; }

    @keyframes dotPulse {
      0%, 60%, 100% { opacity: 0.3; }
      30% { opacity: 1; }
    }

    .version-badge {
      position: absolute;
      bottom: 12px;
      right: 16px;
      font-size: 9px;
      color: #64748B;
      z-index: 2;
    }
  </style>
</head>
<body>
  <div class="splash-container">
    <div class="logo-wrapper">
      <div class="logo-icon">
        <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
          <path d="M21 3H3c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h5v2h8v-2h5c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm0 14H3V5h18v12zM9.5 7.5v9l7-4.5z"/>
        </svg>
      </div>
    </div>

    <div class="app-title">Winners TV</div>
    <div class="app-subtitle">Écran d'Affichage Kiosk</div>

    <div class="loading-container">
      <div class="loading-bar"></div>
    </div>

    <div class="loading-text">
      Chargement de l'affichage TV<span>.</span><span>.</span><span>.</span>
    </div>

    <div class="version-badge">v1.0.0</div>
  </div>
</body>
</html>
